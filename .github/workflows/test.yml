name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full commit SHA for the changed-file lint base
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scripts/requirements-ci.txt
      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v rg >/dev/null; then
            brew install ripgrep
          fi
      - name: Verify ripgrep
        run: rg --version
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r scripts/requirements-ci.txt
      - name: Check SQLite version
        run: python -c "import sqlite3; print(sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 44, 0), 'SQLite 3.44 or newer is required'"
      - name: Prepare public tokenizer cache
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/cow-tiktoken-cache
        run: |
          mkdir -p "$TIKTOKEN_CACHE_DIR"
          python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Run backend test suite
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/cow-tiktoken-cache
        run: python scripts/ci_test.py tests/ -q --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Web JavaScript tests
        run: node --test tests/test_usage_display.mjs tests/web_scroll.test.cjs tests/web_message_mutation.test.cjs
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Desktop scroll tests
        run: node --test desktop/tests/chat-scroll.test.mjs
      - name: Desktop type check and build
        working-directory: desktop
        run: |
          ./node_modules/.bin/tsc --noEmit -p tsconfig.json
          npm run build

  lint:
    name: ruff (changed Python files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - name: Check changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
        run: python scripts/ci_lint.py
